name: Cloud Janitor CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-quality:
    name: 🐍 Python Lint & Security
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }} 

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12" 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Format Code with Black
        run: black . 

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format python code with black 🤖"
          branch: ${{ github.head_ref }}

      - name: Lint with Flake8
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan (Bandit)
        run: bandit -r src/ -f custom 

  infra-quality:
    name: 🐳 Docker & ☁️ Terraform Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Test Docker Build
        run: docker build . --file Dockerfile --tag test-image

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        working-directory: ./terraform  

      - name: Terraform Validate
        id: validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ./terraform